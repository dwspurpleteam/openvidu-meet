parameters:
    - name: roomId
      in: path
      required: true
      schema:
          type: string
get:
    operationId: meetingListPluginActivations
    summary: List plugin activations for the current meeting
    tags: [Internal API - Plugin Activations]
    security:
        - roomMemberTokenHeader: []
    parameters:
        - name: callId
          in: query
          required: true
          description: LiveKit Room SID of the current meeting.
          schema:
              type: string
              minLength: 1
              maxLength: 255
    responses:
        '200':
            description: The activation snapshot visible to a connected room member.
            content:
                application/json:
                    schema:
                        type: object
                        required: [mode, canActivate, activations]
                        properties:
                            mode:
                                type: string
                                enum: [disabled, manager]
                            canActivate:
                                type: boolean
                            activations:
                                type: array
                                items:
                                    $ref: ./activation.yaml
        '401':
            description: Missing or invalid room member token.
        '403':
            description: The member lacks meeting access or has no participant identity.
        '404':
            description: The live meeting or participant is no longer present.
        '422':
            description: Invalid room or call identifier.
        '503':
            description: The activation service is unavailable.
post:
    operationId: meetingCreatePluginActivation
    summary: Request plugin activation as a moderator in the current meeting
    tags: [Internal API - Plugin Activations]
    security:
        - roomMemberTokenHeader: []
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    type: object
                    required: [callId, pluginId, pluginVersion]
                    additionalProperties: false
                    properties:
                        callId:
                            description: LiveKit Room SID used to detect a stale request.
                            type: string
                            minLength: 1
                            maxLength: 255
                        pluginId:
                            type: string
                            minLength: 1
                            maxLength: 255
                        pluginVersion:
                            type: string
                            minLength: 1
                            maxLength: 255
    responses:
        '202':
            description: Activation accepted or existing activation returned.
            content:
                application/json:
                    schema:
                        $ref: ./activation.yaml
        '401':
            description: Missing or invalid room member token.
        '403':
            description: The caller is outside the room or is not a connected moderator.
        '404':
            description: The meeting or participant no longer exists.
        '409':
            description: An activation is already being registered.
        '422':
            description: Invalid activation request.
        '503':
            description: Plugin activation is disabled or Plugin Manager did not return a valid response.
